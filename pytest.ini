[pytest]
testpaths = tests
addopts = -ra
markers =
    smoke: quick sanity checks
    parity: OpenSearch-behaviour corner cases
    mapping: mapping creation and mapping-driven behaviour
    i18n: multilingual (Unicode / non-Latin script) behaviour
    cluster: cluster, nodes and _cat APIs
    admin: index administration (settings, aliases, templates, lifecycle)
    documents: document CRUD, versioning, bulk, by-query APIs
    ingest: ingest pipelines and processors
    fulltext: full-text queries
    queries: term-level, compound, joining, geo and specialized queries
    search_api: search request features (sort, paging, highlight, scroll, PIT, msearch, ...)
    aggs: aggregations
    analysis: analyzers, tokenizers, token/char filters, normalizers
    types: field data types and mapping parameters
    knn: vector search (knn_vector, knn query, knn_score and painless vector functions)
    scripting: painless scripting and search templates
    http: HTTP layer (compression, content types, URLs, query string, headers) and async tasks
    persistence: data survives a server restart (opt-in via OS_RESTART_CMD)
    multinode: multi-node cluster behaviour (opt-in via OS_CLUSTER_URLS)
    crossdc: zone awareness, DC failure and cross-cluster search (opt-in via OS_CLUSTER_URLS / OS_REMOTE_URL)
    concurrency: concurrent requests (races, locking, snapshots, load)
